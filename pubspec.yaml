name: rerune_flutter
description: A Flutter example app demonstrating ReRune localization.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  rerune: ^1.3.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  http: ^1.2.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/fonts/InstrumentSans-OFL.txt
    - assets/fonts/Lora-OFL.txt
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
