name: ReRune app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Verify generated localizations
        run: |
          flutter gen-l10n
          dart run build_runner build
          git diff --exit-code -- lib/l10n/gen
          test -z "$(git ls-files --others --exclude-standard -- lib/l10n/gen)"
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build web --no-pub --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: rerune-web
          path: build/web
